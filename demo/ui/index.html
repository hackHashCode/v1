<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attempts to Green · PreCode-JEPA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
 :root{--bg:#0e1116;--panel:#161b22;--line:#2a313c;--ink:#e6edf3;--muted:#8b949e;--ok:#3fb950;--bad:#f85149;--ours:#d29922;
       --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding:24px max(16px,3vw)}
 h1{font-size:22px;margin:0 0 4px} .sub{color:var(--muted);margin:0 0 18px}
 .specs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
 .specs button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:13px var(--sans);cursor:pointer}
 .specs button:hover,.specs button.on{border-color:var(--ours);color:var(--ours)}
 label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
 textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 var(--mono);margin:4px 0 10px;resize:vertical}
 .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
 .go{background:var(--ours);color:#111;border:0;border-radius:8px;padding:10px 18px;font:600 15px var(--sans);cursor:pointer}
 .go:disabled{opacity:.5;cursor:wait} #status{color:var(--muted);font-size:13px}
 .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
 .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
 .col.ours{border-color:var(--ours)} .col h2{font-size:15px;margin:0 0 2px} .col.ours h2{color:var(--ours)}
 .verdict{font-size:20px;font-weight:600;margin:4px 0 10px}
 .att{display:grid;grid-template-columns:112px 1fr auto;gap:8px;align-items:center;font:13px var(--mono);padding:3px 0}
 .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%}
 .ok{color:var(--ok)} .bad{color:var(--bad)}
 pre{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;max-height:180px;overflow:auto;margin:10px 0 0}
 .foot{color:var(--muted);font-size:12px;margin-top:16px}
</style></head><body>
<h1>Attempts to green</h1>
<p class="sub">Three models, same task, five tries each. Every attempt runs against hidden edge-case tests (the model sees only the first one). Fewer red rows means fewer agent retries.</p>
<div class="specs" id="specs"></div>
<label for="task">Task</label><textarea id="task" rows="2"></textarea>
<label for="tests">Tests: one assert per line (only the first is shown to the model)</label><textarea id="tests" rows="7"></textarea>
<div class="row"><button class="go" id="go" onclick="run()">Run 5 attempts</button><span id="status"></span>
 <label for="api" style="margin-left:auto">API (blank = this server)</label><input id="api" value="" style="background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:13px var(--mono)"></div>
<div class="cols" id="cols"></div>
<p class="foot">Hero tasks are illustrative examples; the claim rests on the results table (224 MBPP+ tasks, 3 seeds).</p>
<script>
const NAMES = {sft: "SFT (next-token only)", jepa: "LLM-JEPA (code-text target)", precode: "PreCode-JEPA (ours, behaviour target)"};
let SPECS = [];
async function loadSpecs(){
  for (const f of ["hero_tasks.json", "specs.json"]) {
    try { const r = await fetch(f); if (r.ok) SPECS = SPECS.concat(await r.json()); } catch (e) {}
  }
  if (!SPECS.length) SPECS = [{label: "Second largest", task: "Write a function to find the second largest distinct number in a list.",
    tests: ["assert second_largest([1, 3, 2]) == 2", "assert second_largest([5, 5, 4]) == 4", "assert second_largest([9, 1, 9, 1]) == 1", "assert second_largest([-1, -2, -3]) == -2"]}];
  specs.innerHTML = SPECS.map((s, i) => `<button onclick="load(${i}, this)">${s.label}</button>`).join("");
  load(0, specs.firstChild);
}
function load(i, el){ task.value = SPECS[i].task; tests.value = SPECS[i].tests.join("\n");
  document.querySelectorAll(".specs button").forEach(b => b.classList.remove("on")); el && el.classList.add("on"); }
function esc(s){ return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
async function run(){
  const t = tests.value.split("\n").map(x => x.trim()).filter(Boolean);
  go.disabled = true; status.textContent = "generating 5 attempts per model…"; cols.innerHTML = "";
  try {
    const r = await fetch((api.value || "").replace(/\/$/, "") + "/solve", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({task: task.value, tests: t, n: 5})});
    if (!r.ok) throw new Error("server returned " + r.status);
    const d = await r.json(); status.textContent = "";
    cols.innerHTML = Object.keys(NAMES).filter(k => d[k]).map(k => {
      const a = d[k], first = a.findIndex(x => x.passed === x.total);
      const rows = a.map((x, i) => { const ok = x.passed === x.total, pct = x.total ? 100 * x.passed / x.total : 0;
        return `<div class="att"><span class="${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"} attempt ${i + 1}</span>
          <span class="bar"><i style="width:${pct}%;background:var(${ok ? "--ok" : "--bad"})"></i></span><span>${x.passed}/${x.total}</span></div>`; }).join("");
      const verdict = first < 0 ? `<span class="bad">not solved in 5</span>` : `<span class="ok">green on attempt ${first + 1}</span>`;
      return `<div class="col ${k === "precode" ? "ours" : ""}"><h2>${NAMES[k]}</h2><div class="verdict">${verdict}</div>${rows}
        <pre>${esc(a[Math.max(first, 0)].code)}</pre></div>`;
    }).join("");
  } catch (e) { status.textContent = "Could not reach the demo server (" + e.message + "). Is the SSH tunnel up?"; }
  go.disabled = false;
}
loadSpecs();
</script></body></html>
