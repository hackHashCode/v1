<!doctype html><meta charset="utf-8"><title>PreCode demo (fallback)</title>
<textarea id="t" rows="3" cols="90">Write a function to find the second largest distinct number in a list.</textarea><br>
<textarea id="x" rows="6" cols="90">assert second_largest([1,3,2])==2
assert second_largest([5,5,4])==4
assert second_largest([9,1,9,1])==1
assert second_largest([-1,-2,-3])==-2</textarea><br>
<button onclick="go()">Run 5 attempts</button><span id="s"></span>
<div id="o" style="display:flex;gap:24px;font-family:monospace"></div>
<script>
async function go(){
  s.textContent=" running...";
  const r=await fetch("http://localhost:8000/solve",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({task:t.value,tests:x.value.split("\n").filter(Boolean),n:5})});
  const d=await r.json(); s.textContent="";
  o.innerHTML=Object.entries(d).map(([k,v])=>`<div><b>${k}</b>`+v.map((a,i)=>
    `<div>attempt ${i+1}: ${a.passed===a.total?"✓":"✗"} ${a.passed}/${a.total}</div>`).join("")+"</div>").join("");
}
</script>
